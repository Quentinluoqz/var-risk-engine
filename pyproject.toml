[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "var-risk-engine"
version = "0.3.0"
description = "Portfolio risk engine: VaR/ES with GARCH, stress testing, EVT, Copula, risk attribution & backtesting"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Quentin" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "yfinance>=0.2",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "arch>=6.0",
    "scikit-learn>=1.3",
    "tabulate>=0.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
var-engine = "var_risk_engine.cli:main_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
